<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIS Management Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h4><i class="fa-solid fa-chart-line me-2"></i>MIS Portal</h4>
        <a href="{{ url_for('home') }}" class="active"><i class="fa-solid fa-gauge me-2"></i>Dashboard</a>
        <a href="{{ url_for('employees') }}"><i class="fa-solid fa-users me-2"></i>Employees</a>
        <a href="{{ url_for('attendance') }}"><i class="fa-solid fa-calendar-check me-2"></i>Attendance</a>
        <a href="{{ url_for('reports') }}"><i class="fa-solid fa-file-excel me-2"></i>MIS Reports</a>
        </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold mb-0">Dashboard Overview</h3>
            <span class="badge bg-primary p-2">Admin Panel</span>
        </div>

        <!-- Summary Cards -->
        <div class="row g-4 mb-4">
            <div class="col-md-4">
                <div class="card stat-card p-3">
                    <div class="text-muted small">Total Employees</div>
                    <h2 class="fw-bold text-primary mt-1">{{ total_emp }}</h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card p-3">
                    <div class="text-muted small">Active Employees</div>
                    <h2 class="fw-bold text-success mt-1">{{ active_emp }}</h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card p-3">
                    <div class="text-muted small">Active Departments</div>
                    <h2 class="fw-bold text-warning mt-1">{{ total_depts }}</h2>
                </div>
            </div>
        </div>

        <!-- Chart Section -->
        <div class="card stat-card p-4">
            <h5 class="fw-bold mb-3">Department-wise Employees</h5>
            <canvas id="deptChart" height="90"></canvas>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const labels = {{ dept_labels | tojson }};
        const counts = {{ dept_counts | tojson }};

        const ctx = document.getElementById('deptChart');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels.length ? labels : ['No Data Yet'],
                datasets: [{
                    label: 'Employees',
                    data: counts.length ? counts : [0],
                    backgroundColor: ['#38bdf8', '#4ade80', '#fbbf24', '#f87171', '#a78bfa'],
                    borderRadius: 6
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
            }
        });
    </script>
</body>
</html>
